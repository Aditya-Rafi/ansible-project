all:
  children:
    db_server:
      hosts:
        dev-db:
          ansible_host: 192.168.0.168
          ansible_port: 22
          ansible_user: "developer"
          ansible_password: "{{ vault_ansible_password }}"
          ansible_become: true
          ansible_become_method: sudo
          ansible_become_user: root
          database_server: mysql
          enable_backup: true
          mysql_host: 192.168.0.192
          mysql_username: "root"
          mysql_password: "{{ vault_mysql_password }}"
          # databases: all  → otomatis backup semua DB non-system
          # databases: "db1,db2,db3"  → spesifik DB (pisahkan dengan koma)
          mysql_instances:
            - port: 3307
              databases: "prohukum_demodb"
            - port: 3308
              databases: "demo_erpdb"
            - port: 3309
              databases: "aic_ph_accounting"
