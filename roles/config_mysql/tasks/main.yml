- name: Wait for MySQL container port
  wait_for:
    host: "127.0.0.1"
    port: "{{ mysql_host_port }}"
    delay: 5
    timeout: 120
  when: not ansible_check_mode

- name: Show MySQL Docker connection info
  debug:
    msg: "MySQL runs in Docker container {{ mysql_container_name }} and is reachable on {{ inventory_hostname }}:{{ mysql_host_port }}."
