# Pembungkus: kegagalan satu DB dicatat lalu run lanjut ke DB berikutnya.
- name: "backup {{ _db }}:{{ _instance.port }}"
  block:
    - name: "jalankan dump {{ _db }}:{{ _instance.port }}"
      include_tasks: dump_db.yml
  rescue:
    - name: "catat kegagalan {{ _db }}:{{ _instance.port }}"
      set_fact:
        _backup_failed: >-
          {{ _backup_failed + [{
               'db': _db,
               'port': _instance.port,
               'version': (_server_version.stdout | default('') | trim),
               'error': ((ansible_failed_result.stderr | default(ansible_failed_result.msg | default('unknown'))) | string | trim)[:1500]
             }] }}
