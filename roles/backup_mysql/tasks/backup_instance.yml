- name: "resolve koneksi (teleport/langsung) port {{ _instance.port }}"
  set_fact:
    _via_teleport: "{{ _instance.teleport_local_port is defined }}"
    _conn_host: "{{ '127.0.0.1' if _instance.teleport_local_port is defined else mysql_host }}"
    _conn_port: "{{ _instance.teleport_local_port | default(_instance.port) }}"
    _conn_user: "{{ _instance.teleport_db_user | default(mysql_username) }}"
    _conn_password: "{{ '' if _instance.teleport_local_port is defined else mysql_password }}"

- name: "info jalur koneksi port {{ _instance.port }}"
  debug:
    msg: >-
      Port {{ _instance.port }} →
      {{ 'via TELEPORT ' ~ _conn_host ~ ':' ~ _conn_port ~ ' (user ' ~ _conn_user ~ ', cert auth)'
         if _via_teleport
         else 'LANGSUNG ' ~ _conn_host ~ ':' ~ _conn_port ~ ' (user ' ~ _conn_user ~ ')' }}

- name: "tentukan spesifikasi database (port {{ _instance.port }})"
  set_fact:
    _db_spec: >-
      {{ (backup_databases | default('') | string | trim)
         or (_instance.databases | default('all')) }}
    _db_exclude_raw: >-
      {{ (backup_exclude_databases | default('') | string | trim)
         or (_instance.exclude_databases | default('')) }}

- name: "discover semua DB non-system dari port {{ _instance.port }}"
  shell: |
    mysql -h {{ _conn_host | quote }} -P {{ _conn_port | string | quote }} \
      -u {{ _conn_user | quote }} \
      --batch --skip-column-names \
      -e "SHOW DATABASES WHERE \`Database\` NOT IN
          ('information_schema', 'performance_schema', 'sys', 'mysql')"
  environment:
    MYSQL_PWD: "{{ _conn_password }}"
  register: _discovered
  changed_when: false
  when: _db_spec is string and (_db_spec | trim | lower) == 'all'

- name: "set DB list dari auto-discovery (port {{ _instance.port }})"
  set_fact:
    _instance_dbs: "{{ _discovered.stdout_lines | select('string') | reject('equalto', '') | list }}"
  when: _db_spec is string and (_db_spec | trim | lower) == 'all'

- name: "set DB list dari inventory/override (port {{ _instance.port }})"
  set_fact:
    _instance_dbs: >-
      {{ (_db_spec.split(',') if _db_spec is string else _db_spec)
         | map('trim') | reject('equalto', '') | list }}
  when: not (_db_spec is string and (_db_spec | trim | lower) == 'all')

- name: "buang database yang dikecualikan (port {{ _instance.port }})"
  set_fact:
    _instance_dbs: >-
      {{ _instance_dbs | difference(
           (_db_exclude_raw.split(',') if _db_exclude_raw is string else _db_exclude_raw)
           | map('trim') | reject('equalto', '') | list) }}

- name: "databases yang akan di-backup pada port {{ _instance.port }}"
  debug:
    msg: "Port {{ _instance.port }}: {{ _instance_dbs | join(', ') }}"

- name: "deteksi versi MySQL server port {{ _instance.port }}"
  shell: |
    mysql -h {{ _conn_host | quote }} -P {{ _conn_port | string | quote }} \
      -u {{ _conn_user | quote }} \
      --batch --skip-column-names -e "SELECT VERSION()"
  environment:
    MYSQL_PWD: "{{ _conn_password }}"
  register: _server_version
  changed_when: false

- name: "pilih image client mysqldump sesuai versi server (port {{ _instance.port }})"
  set_fact:
    _client_image: "{{ 'mysql:8.0' if ((_server_version.stdout | trim).split('.') | first | int) >= 8 else 'mysql:5.7' }}"

- name: "info versi & client (port {{ _instance.port }})"
  debug:
    msg: "Server MySQL {{ _server_version.stdout | trim }} → client mysqldump: {{ _client_image }}"

- name: "backup setiap database pada port {{ _instance.port }}"
  include_tasks: backup_db.yml
  loop: "{{ _instance_dbs }}"
  loop_control:
    loop_var: _db
