- name: "cari semua file backup lebih dari {{ _retention_days }} hari"
  become: true
  find:
    paths: "{{ mysql_backup_dir }}"
    patterns: "backup-*"
    file_type: file
    age: "{{ _retention_days }}d"
    recurse: false
  register: _old_backups

- name: "hapus file backup lama"
  become: true
  file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ _old_backups.files }}"
  loop_control:
    label: "{{ item.path | basename }}"

- name: "info retensi"
  debug:
    msg: >-
      Retensi {{ _retention_days }} hari: {{ _old_backups.files | length }} file dihapus
      ({{ ((_old_backups.files | map(attribute='size') | sum) / 1024 / 1024 / 1024) | round(2) }} GB dibebaskan).
