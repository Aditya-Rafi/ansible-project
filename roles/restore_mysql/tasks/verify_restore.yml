- name: "copy script verifikasi untuk {{ _db }}:{{ _instance.port }}"
  copy:
    src: verify_mysql_integrity.py
    dest: /tmp/verify_mysql_integrity.py
    mode: '0755'

- name: "bandingkan Docker (backup) vs original {{ _db }}:{{ _instance.port }}"
  shell: |
    /tmp/verify_mysql_integrity.py \
      --orig-host "127.0.0.1" \
      --orig-port {{ _restore_port | string | quote }} \
      --orig-user "root" \
      --orig-password "" \
      --orig-db {{ _db | quote }} \
      --dest-host {{ _conn_host | quote }} \
      --dest-port {{ _conn_port | string | quote }} \
      --dest-user {{ _conn_user | quote }} \
      --dest-password {{ _conn_password | quote }} \
      --dest-db {{ _db | quote }}
  register: _verify_result
  failed_when: _verify_result.rc not in [0, 1, 2]

- name: "hasil verifikasi {{ _db }}:{{ _instance.port }}"
  debug:
    msg: "{{ _verify_result.stdout_lines }}"

- name: "assert struktur lengkap untuk {{ _db }}:{{ _instance.port }}"
  assert:
    that:
      - _verify_result.rc != 1
    fail_msg: >-
      STRUKTUR TIDAK LENGKAP: tabel hilang di restore '{{ _db }}' port {{ _instance.port }}.
      Backup mungkin tidak lengkap atau corrupt.
    success_msg: "Struktur '{{ _db }}' lengkap di hasil restore"

- name: "info perbedaan data {{ _db }}:{{ _instance.port }}"
  debug:
    msg: >-
      INFO: Data backup berbeda dengan production saat ini untuk '{{ _db }}' port {{ _instance.port }}.
      Normal jika data production berubah sejak backup dibuat.
  when: _verify_result.rc == 2

- name: "konfirmasi restore identik {{ _db }}:{{ _instance.port }}"
  debug:
    msg: "COCOK 100%: backup '{{ _db }}' port {{ _instance.port }} identik dengan production."
  when: _verify_result.rc == 0
