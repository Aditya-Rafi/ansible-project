- name: "copy verification script for {{ _db }}"
  copy:
    src: verify_mysql_integrity.py
    dest: /tmp/verify_mysql_integrity.py
    mode: '0755'

- name: "Post-Restore Verification: {{ _db }}"
  block:
    - name: "spin up Docker reference container for {{ _db }}"
      shell: |
        docker run -d \
          --name temp-mysql-restore-verify \
          -e MYSQL_ALLOW_EMPTY_PASSWORD=yes \
          -p 127.0.0.1:3310:3306 \
          mysql:5.7
      become: true

    - name: "wait for Docker MySQL to be ready ({{ _db }})"
      shell: |
        docker exec temp-mysql-restore-verify mysqladmin ping -h localhost --silent
      register: _docker_ping
      until: _docker_ping.rc == 0
      retries: 20
      delay: 2
      become: true

    - name: "create reference database {{ _db }} in Docker"
      shell: |
        docker exec temp-mysql-restore-verify \
          mysql -uroot -e "CREATE DATABASE IF NOT EXISTS \`{{ _db }}\`"
      become: true
      register: _create_docker_db
      until: _create_docker_db.rc == 0
      retries: 15
      delay: 3

    - name: "import backup {{ _restore_file }} into Docker (referensi)"
      shell: |
        docker exec -i temp-mysql-restore-verify \
          mysql -uroot {{ _db | quote }} < {{ _restore_file | quote }}
      become: true

    - name: "compare backup (Docker) vs restored ({{ _db }})"
      shell: |
        /tmp/verify_mysql_integrity.py \
          --orig-host "127.0.0.1" \
          --orig-port 3310 \
          --orig-user "root" \
          --orig-password "" \
          --orig-db {{ _db | quote }} \
          --dest-host {{ restore_target_host | quote }} \
          --dest-port {{ restore_target_port | string | quote }} \
          --dest-user {{ restore_target_user | quote }} \
          --dest-password {{ restore_target_password | quote }} \
          --dest-db {{ _db | quote }}
      register: _verify_result
      failed_when: _verify_result.rc not in [0, 1, 2]

    - name: "hasil verifikasi post-restore: {{ _db }}"
      debug:
        msg: "{{ _verify_result.stdout_lines }}"

    - name: "assert restore berhasil 1:1 untuk {{ _db }}"
      assert:
        that:
          - _verify_result.rc == 0
        fail_msg: "Verifikasi GAGAL: data yang di-restore tidak cocok 100% dengan backup untuk database '{{ _db }}'"
        success_msg: "Verifikasi BERHASIL: restore {{ _db }} cocok 100% dengan backup"

  always:
    - name: "remove Docker container ({{ _db }})"
      shell: docker rm -f temp-mysql-restore-verify
      become: true
      ignore_errors: true
