- name: ensure mysql client is installed
  become: true
  package:
    name: default-mysql-client
    state: present

- name: get restore timestamp
  command: date +%Y%m%dT%H%M%S
  register: _ts_cmd
  changed_when: false

- name: get container removal date (3 hari dari sekarang)
  command: date -d '+3 days' '+%-d %-m'
  register: _removal_date_cmd
  changed_when: false

- name: set restore session facts
  set_fact:
    _restore_ts: "{{ _ts_cmd.stdout }}"
    _removal_day: "{{ _removal_date_cmd.stdout.split(' ')[0] }}"
    _removal_month: "{{ _removal_date_cmd.stdout.split(' ')[1] }}"

- name: restore setiap MySQL instance
  include_tasks: restore_instance.yml
  loop: "{{ mysql_instances }}"
  loop_control:
    loop_var: _instance
