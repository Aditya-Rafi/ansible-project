[defaults]
roles_path = ./roles
inventory = ./inventory/hosts.yaml
deprecation_warnings = False
interpreter_python = /usr/bin/python3
host_key_checking = False

[ssh_connection]
# Default = jalur HOST (sertifikat di /home/developer/teleport-ssh/machine-id).
# Di dalam container Semaphore, nilai ini DITIMPA lewat Environment 'teleport-ssh':
#   ANSIBLE_SSH_ARGS = -F /home/semaphore/ansible/teleport-docker.cfg
ssh_args = -F ./teleport.cfg
# WAJIB untuk Teleport: scp modern salah mem-parse host lewat ProxyCommand
# ("hostname contains invalid characters"). piped mengalirkan modul lewat stdin.
transfer_method = piped
pipelining = true
