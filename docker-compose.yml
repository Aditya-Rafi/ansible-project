
services:
  semaphore:
    image: semaphoreui/semaphore:latest
    container_name: semaphore
    user: "0:0"                            # root — bisa baca cert tbot (root) di volume bersama
    ports:
      - "3001:3000"
    env_file:
      - .env.semaphore
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "${TELEPORT_PROXY_ALIAS:?set di .env}:${TELEPORT_PROXY_HOST:?set di .env}"
    depends_on:
      - db
    restart: unless-stopped
    volumes:
      - semaphore_data:/var/lib/semaphore
      - .:/home/semaphore/ansible
      # Teleport: binary (static, jalan di Alpine) + sertifikat dari sidecar
      - /opt/teleport/system/bin/tbot:/usr/local/bin/tbot:ro
      - teleport_id:/teleport-id:ro

  # Sidecar Machine ID: jaga sertifikat SSH Teleport tetap segar di volume bersama
  tbot:
    image: alpine:3.21
    container_name: semaphore-tbot
    user: "0:0"                            # root — hindari "unknown userid 1001"; root nulis, root baca
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "${TELEPORT_PROXY_ALIAS:?set di .env}:${TELEPORT_PROXY_HOST:?set di .env}"
    volumes:
      - /opt/teleport/system/bin/tbot:/usr/local/bin/tbot:ro
      - teleport_id:/teleport-id
      - ./teleport/tbot-semaphore.yaml:/etc/tbot.yaml:ro
    command: ["/usr/local/bin/tbot", "start", "-c", "/etc/tbot.yaml", "--insecure"]

  db:
    image: postgres:14
    container_name: semaphore-db
    env_file:
      - .env.semaphore
    restart: unless-stopped
    volumes:
      - semaphore_db:/var/lib/postgresql/data

  provisioner:
    image: python:3-alpine
    container_name: semaphore-provisioner
    env_file:
      - .env.semaphore
    volumes:
      - ./provision:/provision:ro
      - .:/home/semaphore/ansible:ro
    depends_on:
      - semaphore
    command: python /provision/provision-semaphore.py

  # Bot Telegram: terima laporan DB gagal dari playbook, kirim tombol
  # Backup / Tunda / Batal, lalu jalankan ulang template di Semaphore.
  # Tanpa port publik (long-polling keluar ke Telegram).
  backup-bot:
    image: python:3-alpine
    container_name: backup-bot
    env_file:
      - .env.semaphore
    environment:
      SEMAPHORE_URL: http://semaphore:3000/api
      STATE_FILE: /data/state.json
    volumes:
      - ./bot:/bot:ro
      - ./inventory/hosts.yaml:/inventory/hosts.yaml:ro   # peta server -> tombol Backup
      - bot_data:/data
    depends_on:
      - semaphore
    restart: unless-stopped
    command: python -u /bot/backup_bot.py

volumes:
  bot_data:
  semaphore_data:
  semaphore_db:
  teleport_id:
